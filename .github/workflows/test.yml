name: test

on:
  pull_request:
  push:
    branches: [main]

# No secrets: tests use the built-in database. Code Dungeon's auto-merge waits for this to pass.
jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Install Playwright's Chromium
        run: npx playwright install ${{ matrix.os == 'ubuntu-latest' && '--with-deps' || '' }} chromium
      - run: npm run test:e2e
      - run: npm run build
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: playwright-report/
          retention-days: 7
